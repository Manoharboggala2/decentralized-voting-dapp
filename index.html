<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusVote | Decentralized Poll</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <script src="https://cloudflare.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
    body {
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      background: #070913; color: #f8fafc; overflow-x: hidden; padding: 20px; perspective: 1200px;
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(90px); z-index: -1; opacity: 0.55; animation: floatOrb 12s infinite alternate ease-in-out; }
    .orb-1 { width: 380px; height: 380px; background: #4f46e5; top: -80px; left: -60px; }
    .orb-2 { width: 340px; height: 340px; background: #06b6d4; bottom: -60px; right: -40px; animation-delay: -5s; }
    .orb-3 { width: 240px; height: 240px; background: #ec4899; top: 45%; left: 55%; animation-delay: -8s; }
    @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, -35px) scale(1.12); } }

    .glass-card {
      width: 100%; max-width: 560px; background: rgba(17, 24, 39, 0.65);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-top: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px; padding: 34px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
      transform-style: preserve-3d; transition: transform 0.15s ease-out;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35); color: #34d399; padding: 6px 14px;
      border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 16px;
    }
    .pulse-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } }

    h1 { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #fff 0%, #93c5fd 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .subtitle { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }

    .connect-btn {
      width: 100%; padding: 14px 20px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); color: white;
      font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4); transition: all 0.25s ease;
    }
    .connect-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(6, 182, 212, 0.5); }

    .wallet-bar {
      display: none; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 16px; border-radius: 14px; margin-bottom: 22px; font-size: 13px;
    }
    .wallet-pill { color: #38bdf8; font-weight: 600; }

    .candidate-card {
      background: rgba(30, 41, 59, 0.55); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; transition: all 0.25s ease; animation: slideUp 0.45s ease forwards;
    }
    .candidate-card:hover { transform: translateY(-3px) scale(1.01); border-color: rgba(56, 189, 248, 0.45); background: rgba(30, 41, 59, 0.85); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .candidate-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .candidate-name { font-size: 18px; font-weight: 700; color: #f1f5f9; }
    .vote-stats { font-size: 13px; color: #94a3b8; margin-right: 12px; }

    .vote-btn {
      padding: 8px 18px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s ease;
    }
    .vote-btn:hover:not(:disabled) { background: #0284c7; color: white; box-shadow: 0 0 18px rgba(2, 132, 199, 0.6); }
    .vote-btn:disabled { opacity: 0.45; cursor: not-allowed; border-color: rgba(255, 255, 255, 0.1); color: #94a3b8; }

    .progress-track { width: 100%; height: 7px; background: rgba(15, 23, 42, 0.8); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #06b6d4); border-radius: 999px; transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1); }

    .status-box { display: none; margin-top: 18px; padding: 14px 16px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-break: break-word; }
    .status-box a { color: #38bdf8; font-weight: 600; text-decoration: underline; }
    .footer-note { margin-top: 22px; text-align: center; font-size: 12px; color: #64748b; }
    .footer-note a { color: #94a3b8; text-decoration: none; }
    .footer-note a:hover { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="glass-card" id="tiltCard">
    <div class="badge"><span class="pulse-dot"></span> ETHEREUM SEPOLIA TESTNET</div>
    <h1>Decentralized Language Poll</h1>
    <p class="subtitle">Tamper-proof on-chain voting. Every ballot is cryptographically signed by your wallet and permanently verified on Ethereum.</p>

    <button class="connect-btn" id="connectBtn" onclick="connectWallet()">Connect MetaMask Wallet</button>

    <div class="wallet-bar" id="walletBar">
      <span>Connected Account</span>
      <span class="wallet-pill" id="walletAddress">0x0000...0000</span>
    </div>

    <div id="candidatesList"></div>
    <div class="status-box" id="statusBox"></div>

    <div class="footer-note">
      Verified Smart Contract • <a id="contractLink" href="#" target="_blank">Inspect on Sepolia Etherscan ↗</a>
    </div>
  </div>

  <!-- Links to File 2 (app.js) in the same folder -->
  <script src="app.js"></script>
</body>
</html>
